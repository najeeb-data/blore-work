<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#263FE5">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job — BloreWork</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base/variables.css">
  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/typography.css">
  <link rel="stylesheet" href="/css/components/buttons.css">
  <link rel="stylesheet" href="/css/components/navbar.css">
  <link rel="stylesheet" href="/css/components/bottom-nav.css">
  <link rel="stylesheet" href="/css/components/cards.css">
  <link rel="stylesheet" href="/css/pages/dashboard.css">
</head>
<body>
  <header id="navbar-root"></header>
  
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <a class="dashboard-sidebar__link" href="/pages/client/profile.html"><i data-lucide="building" class="icon"></i> Business Profile</a>
      <a class="dashboard-sidebar__link active" href="/pages/client/post-job.html"><i data-lucide="plus-circle" class="icon"></i> Post a Job</a>
    </aside>

    <div class="dashboard-tabs">
      <a href="/pages/client/profile.html"><i data-lucide="building" class="icon"></i> Profile</a>
      <a href="/pages/client/post-job.html" class="active"><i data-lucide="plus-circle" class="icon"></i> Post Job</a>
    </div>

    <main class="dashboard-content" style="max-width: 640px;">
      <div class="dashboard-header"><h1>Post a Job</h1></div>
      <div class="card">
        <form id="post-job-form">
          <div class="form-group">
            <label class="form-label">Job Title</label>
            <input id="job-title" class="form-input" type="text" placeholder="e.g. Waitstaff for Wedding" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Work Category</label>
            <select id="job-category" class="form-input" required>
              <option value="">Select a category...</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Work Type</label>
            <select id="job-worktype" class="form-input" required>
              <option value="">Select work type...</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Job Description</label>
            <textarea id="job-desc" class="form-input" rows="3" placeholder="Describe the work, dress code, and requirements..." required></textarea>
          </div>
          
          <div style="display: flex; gap: 16px;">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Date</label>
              <input id="job-date" class="form-input" type="date" required>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Start Time</label>
              <input id="job-time" class="form-input" type="time" required>
            </div>
          </div>

          <div style="display: flex; gap: 16px;">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Workers Needed</label>
              <input id="job-workers" class="form-input" type="number" min="1" value="1" required>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Pay (₹)per day)</label>
              <input id="job-pay" class="form-input" type="number" placeholder="e.g. 800" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Location (Area)</label>
            <select id="job-location" class="form-input" required>
              <option value="">Select an area...</option>
            </select>
          </div>
          
          <button class="btn btn-primary btn-block" style="margin-top: 24px;" type="submit">Publish Job</button>
        </form>
      </div>
    </main>
  </div>
  
  <nav id="bottom-nav-root"></nav>
  <script src="https://unpkg.com/lucide@0.469.0"></script>
  <script type="module" src="/js/pages/post-job.page.js?v=14"></script>
</body>
</html>
