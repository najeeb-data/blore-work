<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#0018E8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <title>BloreWork — Find Nearby Daily Work. Hire Workers in Minutes.</title>
  <meta name="description" content="Hyperlocal job marketplace for Bangalore. Find nearby daily work or hire workers in minutes.">
  <script>
    // Apply stored theme before first paint to prevent a light/dark flash.
    (function () {
      try {
        var t = localStorage.getItem('blorework_theme');
        document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'light') ? t : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base/variables.css">
  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/typography.css">
  <link rel="stylesheet" href="/css/components/buttons.css">
  <link rel="stylesheet" href="/css/components/chips.css">
  <link rel="stylesheet" href="/css/components/navbar.css">
  <link rel="stylesheet" href="/css/components/footer.css">
  <link rel="stylesheet" href="/css/components/bottom-nav.css">
  <link rel="stylesheet" href="/css/components/cards.css">
  <link rel="stylesheet" href="/css/pages/home.css">
</head>
<body>
  <header id="navbar-root"></header>

  <main>
    <section class="hero">
      <div class="hero__inner">
        <p class="hero__eyebrow">NEW JOBS ADDED DAILY IN BANGALORE</p>
        <h1 class="hero__title">Find Nearby Daily Work. Hire Workers in <span class="gradient-text">Minutes.</span></h1>
        <p class="hero__lead">Workers find work today, tomorrow, or this weekend. Businesses hire in minutes.</p>
        <form class="hero__search" onsubmit="event.preventDefault()">
          <input class="hero__search-input" type="search" placeholder="Job title or category" aria-label="Search jobs">
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
        <div class="hero__chips">
          <button class="chip">Today</button>
          <button class="chip">Tomorrow</button>
          <button class="chip">This Weekend</button>
          <button class="chip">Nearby Jobs</button>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer-root"></footer>
  <nav id="bottom-nav-root"></nav>

  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
