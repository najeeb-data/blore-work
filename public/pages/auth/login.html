<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263FE5">
  <title>Log In — BloreWork</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body data-mode="login" class="auth-body">
  <main class="auth-wrap">
    <a href="/index.html" class="brand auth-brand">BloreWork</a>
    <section class="card auth-card">
      <h1>Log in</h1>
      <p class="muted">New here? <a href="/pages/auth/register.html?role=worker">Create an account</a></p>
      <button type="button" class="btn btn-secondary btn-block" id="googleBtn" style="margin-top:16px">Continue with Google</button>
      <div class="divider"><span>or use your phone</span></div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Example: 9876543210">
        <div class="hint">We will send a 6-digit code by SMS.</div>
      </div>
      <div class="field" id="otpField" hidden>
        <label for="otp">Enter OTP</label>
        <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code">
        <div class="hint"><button type="button" class="link-btn" id="resendBtn" disabled>Resend OTP</button></div>
      </div>
      <div id="authMsg" class="auth-msg" role="alert" hidden></div>
      <button type="button" class="btn btn-primary btn-block" id="sendOtpBtn">Send OTP</button>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@0.469.0"></script>
  <script type="module" src="/js/auth-ui.js"></script>
</body>
</html>
